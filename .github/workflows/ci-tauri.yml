name: CI Tauri

on:
  workflow_call:
    inputs:
      backend-path:
        description: Pasta do crate Rust do Tauri.
        type: string
        default: apps/backend

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.backend-path }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Rust fmt
        working-directory: ${{ inputs.backend-path }}
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: ${{ inputs.backend-path }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: ${{ inputs.backend-path }}
        run: cargo test
