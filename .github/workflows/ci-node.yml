name: CI Node

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      prepare-command:
        description: Comando rodado depois do install e antes do typecheck (ex.: pnpm db:generate).
        type: string
        default: ''
      run-tests:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sem versão fixa: o action lê o campo "packageManager" do package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        if: inputs.prepare-command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: bash -c "$PREPARE_COMMAND"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        if: inputs.run-tests
        run: pnpm test
